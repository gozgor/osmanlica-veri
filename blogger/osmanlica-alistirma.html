#osm-app .osm-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px}
#osm-app button{font:inherit;font-size:.95em;cursor:pointer;border:1px solid #d9c6a8;background:#fff;color:#4a3426;padding:8px 12px;border-radius:999px;margin:0;line-height:1.2;box-shadow:none;text-transform:none}

#osm-app .osm-text.para{font-size:1.75em;text-align:right;line-height:2.2}
#osm-app textarea{width:100%;font:inherit;font-size:1.1em;padding:10px 12px;border:1px solid #d9c6a8;border-radius:10px;background:#fff;color:#2b2420;resize:vertical;margin:0}
#osm-app .osm-main{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#osm-app .osm-main button{flex:1;min-width:120px;border-radius:10px;padding:11px}
#osm-app .osm-check{background:#7a3e1d;border-color:#7a3e1d;color:#fff}
#osm-app .osm-check:hover{background:#5f2f15}
#osm-app .osm-mic.rec{background:#b3261e;border-color:#b3261e;color:#fff}
#osm-app .osm-fb{margin-top:12px;padding:10px 12px;border-radius:10px;display:none;font-size:.97em}
#osm-app .osm-fb.ok{display:block;background:#e7f4e8;color:#1e5b26}
#osm-app .osm-fb.near{display:block;background:#fff3dc;color:#7a4b00}
#osm-app .osm-fb.bad{display:block;background:#fbe7e5;color:#8c1d16}
#osm-app .osm-fb.info{display:block;background:#eef0f6;color:#2f3a5c}
#osm-app .osm-fb .w-ok{color:#1e5b26;font-weight:600}
#osm-app .osm-fb .w-miss{color:#b3261e;text-decoration:underline wavy}
#osm-app .osm-note{font-size:.8em;color:#8a7461;text-align:center;margin-top:10px}
#osm-app .osm-hidden{display:none}

  // Kelime sonu sertleşmesi (kitab/kitap, mekteb/mektep, ahmed/ahmet) fark etmesin
  function soft(w) { return w.replace(/b$/, "p").replace(/d$/, "t").replace(/c$/, "ç").replace(/ğ/g, "g"); }
  function words(s) { var n = norm(s); return n ? n.split(" ").map(soft) : []; }
  function key(s) { return words(s).join(""); }
  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }
  function ratio(a, b) { var mx = Math.max(a.length, b.length); return mx ? 1 - lev(a, b) / mx : 1; }

  /* ========== DURUM ========== */
  var st = { level: 0, mode: "yazi", queue: [], cur: null, asked: 0, correct: 0, answered: false, missed: false };
  var rec = null, listening = false, lastAlts = [];

  function isPara() { return !!DATA[st.level].para; }

  /* ========== ARAYÜZ ========== */
  function buildLevels() {
    var box = $("osm-levels"); box.innerHTML = "";
    DATA.forEach(function (lv, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = lv.ad; if (i === st.level) b.className = "on";
      b.onclick = function () { st.level = i; buildLevels(); startRound(); };
      box.appendChild(b);
    });
  }
  function setMode(m) {
    st.mode = m;
    $("osm-mode-yazi").className = m === "yazi" ? "on" : "";
    $("osm-mode-ses").className = m === "ses" ? "on" : "";
    $("osm-mic").classList.toggle("osm-hidden", m !== "ses");
    $("osm-input").placeholder = m === "ses" ? "Duyulan metin burada görünür, düzeltebilirsiniz…" : (isPara() ? "Paragrafın okunuşunu Latin harfleriyle yazın…" : "Okunuşu Latin harfleriyle yazın…");
  }
  function fb(cls, html) { var f = $("osm-fb"); f.className = "osm-fb " + cls; f.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function updateMeta() {
    $("osm-score").textContent = "Doğru: " + st.correct + " / " + st.asked;
    $("osm-left").textContent = "Kalan: " + st.queue.length;
  }

  function startRound() {
    stopMic();
    st.queue = shuffle(DATA[st.level].items).slice(0, isPara() ? 5 : 15); st.asked = 0; st.correct = 0;
    $("osm-play").classList.remove("osm-hidden");
    next(true);
  }
  function next(first) {
    stopMic();
    if (!first && st.missed && st.cur && !st.cur.again) {
      var c = {}; for (var k in st.cur) c[k] = st.cur[k]; c.again = true; st.queue.push(c);
    }
    if (!st.queue.length) return finish();
    st.cur = st.queue.shift(); st.asked++; st.answered = false; st.missed = false;
    var t = $("osm-text"); t.textContent = st.cur.o; t.className = "osm-text" + (isPara() ? " para" : "");
    var inp = $("osm-input"); inp.value = ""; inp.rows = isPara() ? 4 : 1;
    $("osm-fb").className = "osm-fb"; $("osm-listen").classList.add("osm-hidden");
    setMode(st.mode); updateMeta();
    if (st.mode === "yazi") { try { inp.focus({ preventScroll: true }); } catch (e) {} }
  }
  function finish() {
    $("osm-text").className = "osm-text para"; $("osm-text").style.textAlign = "center";
    $("osm-text").textContent = "Tur bitti! 🎉";
    $("osm-play").classList.add("osm-hidden");
    var card = $("osm-card"), old = $("osm-end"); if (old) old.remove();
    var d = document.createElement("div"); d.id = "osm-end"; d.style.textAlign = "center";
    d.innerHTML = "<p>" + st.asked + " sorudan <b>" + st.correct + "</b> tanesini doğru cevapladınız.</p>";
    var b = document.createElement("button"); b.type = "button"; b.className = "on"; b.textContent = "Tekrar başla";
    b.onclick = function () { d.remove(); $("osm-text").style.textAlign = ""; startRound(); };
    d.appendChild(b); card.appendChild(d);
    $("osm-score").textContent = "Doğru: " + st.correct + " / " + st.asked; $("osm-left").textContent = "";
  }

  function markCorrect() { if (!st.answered) { st.correct++; } st.answered = true; $("osm-listen").classList.remove("osm-hidden"); updateMeta(); }
  function anlam() {
    var c = st.cur, p = [];
    if (c.a) p.push("Anlamı: " + esc(c.a));
    if (c.t && c.t !== c.a) p.push("Bugünkü Türkçe: " + esc(c.t));
    if (c.e) p.push("İngilizce: " + esc(c.e));
    return p.length ? " <br><small>" + p.join("<br>") + "</small>" : "";
  }

  /* ========== KONTROL ========== */
  function check(inputs) {
    inputs = inputs.filter(function (x) { return x && x.trim(); });
    if (!inputs.length) { fb("info", "Önce okunuşu yazın ya da sesle okuyun."); return; }
    if (isPara()) return checkPara(inputs[0]);
    var answers = [st.cur.l].concat(st.cur.v || []), best = 0;
    inputs.forEach(function (inp) { answers.forEach(function (ans) { best = Math.max(best, ratio(key(inp), key(ans))); }); });
    var heard = st.mode === "ses" ? "<br><small>Duyulan: “" + esc(inputs[0]) + "”</small>" : "";
    if (best >= 0.85) { markCorrect(); fb("ok", "✅ Doğru! Okunuşu: <b>" + esc(st.cur.l) + "</b>" + anlam()); }
    else if (best >= 0.6) { fb("near", "🟡 Çok yakın, bir daha deneyin." + heard); }
    else { st.missed = true; fb("bad", "❌ Olmadı. Tekrar deneyin ya da cevabı görün." + heard); }
  }
  function checkPara(text) {
    var toks = st.cur.l.split(/\s+/), exp = toks.map(function (t) { return key(t); });
    var usr = words(text), n = exp.length, m = usr.length, i, j;
    function eq(a, b) { return a && b && ratio(a, b) >= 0.75; }
    // Kelime düzeyinde en uzun ortak dizi (eksik/fazla kelimelere dayanıklı)
    var L = []; for (i = 0; i <= n; i++) { L[i] = []; for (j = 0; j <= m; j++) L[i][j] = 0; }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
      L[i][j] = eq(exp[i], usr[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var ok = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (eq(exp[i], usr[j])) { ok[i] = true; i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
    }
    var hit = ok.filter(Boolean).length, pct = Math.round(hit / n * 100);
    var html = toks.map(function (t, k) { return '<span class="' + (ok[k] ? "w-ok" : "w-miss") + '">' + esc(t) + "</span>"; }).join(" ");
    if (pct >= 85) { markCorrect(); fb("ok", "✅ %" + pct + " doğru!<br>" + html + anlam()); }
    else { if (pct < 60) st.missed = true; fb(pct >= 60 ? "near" : "bad", "%" + pct + " doğru. Altı çizili kelimeleri tekrar deneyin:<br>" + html); }
  }
  function reveal() {
    st.missed = true; st.answered = true;
    fb("info", "Doğru okunuş: <b>" + esc(st.cur.l) + "</b>" + anlam());
    $("osm-listen").classList.remove("osm-hidden");
  }

  /* ========== SES ========== */
  function speak(t) {
    if (!("speechSynthesis" in window)) { fb("info", "Bu tarayıcı sesli okumayı desteklemiyor."); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t.replace(/-/g, " ")); u.lang = "tr-TR"; u.rate = 0.85;
    var v = speechSynthesis.getVoices().filter(function (x) { return /^tr/i.test(x.lang); })[0]; if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  function micBtn() {
    var b = $("osm-mic"); b.classList.toggle("rec", listening);
    b.textContent = listening ? (isPara() ? "⏹ Bitirdim" : "● Dinliyorum…") : "🎤 Okumaya başla";
  }
  function stopMic() { if (rec && listening) { try { rec.onend = null; rec.abort(); } catch (e) {} } listening = false; micBtn(); }
  function startMic() {
    if (!SR) return;
    if (listening) { rec.stop(); return; }
    var para = isPara(), finalText = ""; lastAlts = [];
    rec = new SR(); rec.lang = "tr-TR"; rec.interimResults = para; rec.continuous = para; rec.maxAlternatives = para ? 1 : 5;
    rec.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) { finalText += r[0].transcript + " "; if (!para) for (var k = 0; k < r.length; k++) lastAlts.push(r[k].transcript); }
        else interim += r[0].transcript;
      }
      $("osm-input").value = (finalText + interim).trim();
    };
    rec.onerror = function (e) {
      var msg = { "not-allowed": "Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden izin verebilirsiniz.",
                  "no-speech": "Ses algılanmadı, tekrar deneyin.", "network": "Ses tanıma için internet bağlantısı gerekiyor." }[e.error];
      fb("info", msg || "Ses tanımada bir sorun oldu (" + e.error + ").");
    };
    rec.onend = function () {
      listening = false; micBtn();
      var v = $("osm-input").value;
      if (!para && lastAlts.length) check(lastAlts); else if (v.trim()) check([v]);
    };
    try { rec.start(); listening = true; micBtn(); fb("info", para ? "Paragrafı okuyun, bitince ⏹ düğmesine basın." : "Kelimeyi okuyun…"); }
    catch (e) { fb("info", "Mikrofon başlatılamadı."); }
  }

  /* ========== OLAYLAR ========== */
  $("osm-check").onclick = function () { check([$("osm-input").value]); };
  $("osm-input").onkeydown = function (e) { if (e.key === "Enter" && !isPara()) { e.preventDefault(); check([this.value]); } };
  $("osm-reveal").onclick = reveal;
  $("osm-next").onclick = function () { next(false); };
  $("osm-listen").onclick = function () { speak(st.cur.l); };
  $("osm-mic").onclick = startMic;
  $("osm-mode-yazi").onclick = function () { stopMic(); setMode("yazi"); };
  $("osm-mode-ses").onclick = function () { setMode("ses"); };
  if (!SR) {
    $("osm-mode-ses").disabled = true;
    $("osm-mode-ses").title = "Bu tarayıcı sesli kontrolü desteklemiyor";
    $("osm-note").textContent = "Bu tarayıcı sesli kontrolü desteklemiyor; yazarak devam edebilirsiniz. (Sesli mod için Android veya bilgisayarda Chrome önerilir.)";
  }
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  function veriYukle() {
    if (!window.fetch || !window.Promise) return Promise.resolve(false);
    var bitti = false;
    var zaman = new Promise(function (ok) { setTimeout(function () { ok(null); }, 7000); });
    var istek = Promise.all(VERI_DOSYALARI.map(function (d) {
      return fetch(VERI_ADRESI + d).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    })).catch(function () { return null; });
    return Promise.race([istek, zaman]).then(function (liste) {
      if (bitti || !liste) return false;
      bitti = true;
      var gecerli = liste.every(function (lv) {
        return lv && lv.items && lv.items.length && lv.items.every(function (x) { return x && x.o && x.l; });
      });
      if (!gecerli) return false;
      DATA = liste;
      return true;
    });
  }

  buildLevels(); setMode("yazi");
  $("osm-text").textContent = "…"; $("osm-score").textContent = "Kelimeler yükleniyor…";
  veriYukle().then(function (cevrimici) {
    var toplam = 0; DATA.forEach(function (lv) { if (!lv.para) toplam += lv.items.length; });
    $("osm-src").innerHTML = cevrimici
      ? toplam + " kelime · Kaynak: grubun listesi ve <a href=\"https://en.wiktionary.org/wiki/Category:Ottoman_Turkish_lemmas\" target=\"_blank\" rel=\"noopener\">Vikisözlük</a> (CC BY-SA 4.0)"
      : toplam + " kelime (çevrimdışı liste)";
    buildLevels(); startRound();
  });
})();
</script>
